<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Racers Multiplayer</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10251e;color:white;font-family:Arial,sans-serif;text-align:center}
h1{margin:12px 0;color:#ffe66d}
p{margin:7px}
button,input{padding:11px;margin:4px;border:0;border-radius:8px;font-size:15px}
button{background:#ffe66d;font-weight:bold;cursor:pointer}
input{width:min(280px,90%);background:white}
canvas{display:block;width:min(100%,900px);height:auto;margin:12px auto;border:3px solid white;border-radius:10px}
#status{color:#bcebdc;font-size:14px;overflow-wrap:anywhere;padding:6px}
</style>
</head>
<body>
<h1>🏁 SKY RACERS MULTIPLAYER 🏎️</h1>
<p>Drive: W A S D or arrow keys</p>
<p id="info">Speed: 0 km/h | Distance: 0 m</p>

<div>
<button id="host">Create Room</button>
<button id="copy">Copy Room ID</button><br>
<input id="room" placeholder="Enter your friend's Room ID">
<button id="join">Join Room</button>
<p id="status">Solo mode — create a room to invite a friend.</p>
 <button id="startRace">🏁 START RACE</button>

<p id="raceInfo">Waiting for race to start</p>
 <p id="lapInfo">Lap: 0 / 3</p>
</div>
<canvas id="game" width="900" height="600"></canvas>
<div>
<button id="left">⬅ LEFT</button>
<button id="gas">▲ GAS</button>
<button id="brake">▼ BRAKE</button>
<button id="right">RIGHT ➡</button>
<button id="reset">↻ RESTART</button>
</div>
<p>Sky Racers — Multiplayer test version</p>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=900,H=600;
const keys={};
let carX=0,speed=0,distance=0,roadOffset=0;
let peer=null,conn=null,remote=null;
let lastSend=0;

let raceStartAt = 0;
let raceStarted = false;
let raceFinished = false;

let currentLap = 0;
const totalLaps = 3;
const lapDistance = 100;
let raceProgress = 0;

const status=document.getElementById("status");


function setStatus(s){status.textContent=s;}
 function updateRaceDisplay() {
  const info = document.getElementById("raceInfo");
  if (!info) return;

  if (raceFinished) {
    info.textContent = "🏁 Race finished!";
  } else if (!raceStartAt) {
    info.textContent = "Waiting for race to start";
  } else {
    const remaining = raceStartAt - Date.now();

    if (remaining > 0) {
      info.textContent =
        "🏁 Race starts in " + Math.ceil(remaining / 1000);
    } else {
      raceStarted = true;
      info.textContent = "🚦 GO! Race started!";
    }
  }
}

document.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
});
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function hold(id,key){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[key]=true;
  if(el.setPointerCapture)el.setPointerCapture(e.pointerId);
 });
 ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>
  el.addEventListener(ev,()=>keys[key]=false));
}
hold("left","arrowleft");
hold("right","arrowright");
hold("gas","arrowup");
hold("brake","arrowdown");

document.getElementById("reset").onclick=()=>{
 carX=0;speed=0;distance=0;roadOffset=0;
};

function setupConnection(c){
 conn=c;
 conn.on("open",()=>{
  setStatus("Connected! You and your friend can race.");
 });
 conn.on("data",data=>{
  if(data && data.type==="car")remote=data;
 if(data && data.type==="raceStart"){
    raceStartAt=data.startAt;
    raceStarted=false;
    raceFinished=false;
  }});
 conn.on("close",()=>{
  conn=null;remote=null;
  setStatus("Friend disconnected. You can keep driving solo.");
 });
 conn.on("error",()=>{
  setStatus("Connection problem. Try joining the room again.");
 });
}

document.getElementById("host").onclick=()=>{
 if(typeof Peer==="undefined"){
  setStatus("Multiplayer library did not load. Check your internet and reload.");
  return;
 }
 if(peer)peer.destroy();
 conn=null;remote=null;
 setStatus("Creating room...");
 peer=new Peer();
 peer.on("open",id=>{
  document.getElementById("room").value=id;
  setStatus("Room created! Share this Room ID with your friend.");
 });
 peer.on("connection",c=>{
  if(conn){c.close();return;}
  setupConnection(c);
 });
 peer.on("error",e=>{
  setStatus("Could not create room ("+e.type+"). Try again.");
 });
};

document.getElementById("join").onclick=()=>{
 const id=document.getElementById("room").value.trim();
 if(!id){setStatus("Enter your friend's Room ID first.");return;}
 if(typeof Peer==="undefined"){
  setStatus("Multiplayer library did not load. Check your internet and reload.");
  return;
 }
 if(peer)peer.destroy();
 conn=null;remote=null;
 setStatus("Connecting to your friend...");
 peer=new Peer();
 peer.on("open",()=>{
  const c=peer.connect(id);
  setupConnection(c);
 });
 peer.on("error",e=>{
  setStatus("Could not connect ("+e.type+"). Check the Room ID and try again.");
 });
};

document.getElementById("copy").onclick=async()=>{
 const id=document.getElementById("room").value.trim();
 if(!id){setStatus("Create a room first to get your Room ID.");return;}
 try{
  await navigator.clipboard.writeText(id);
  setStatus("Room ID copied! Send it to your friend.");
 }catch(e){
  document.getElementById("room").select();
  setStatus("Room ID selected. Press Ctrl+C to copy it.");
 }
};

 document.getElementById("startRace").onclick=()=>{
  if(!conn || !conn.open){
    setStatus("Connect to a friend before starting the race.");
    return;
  }

  raceStartAt=Date.now()+5000;
  raceStarted=false;
  raceFinished=false;
  currentLap = 0;
raceProgress = 0;
distance = 0;

  conn.send({
    type:"raceStart",
    startAt:raceStartAt
  });

  updateRaceDisplay();
};
 function polygon(points,color){
 ctx.fillStyle=color;ctx.beginPath();
 points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
 ctx.closePath();ctx.fill();
}

function drawCar(x,y,color,label){
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle="#111";
 ctx.fillRect(-29,-8,12,28);ctx.fillRect(17,-8,12,28);
 ctx.fillStyle=color;ctx.fillRect(-23,-28,46,58);
 ctx.fillStyle="#ffffff66";ctx.fillRect(-18,-23,36,12);
 ctx.fillStyle="#a9edff";ctx.fillRect(-16,-8,32,16);
 ctx.fillStyle="#ffe66d";ctx.fillRect(-20,22,10,5);ctx.fillRect(10,22,10,5);
 ctx.fillStyle="white";ctx.font="bold 13px Arial";ctx.textAlign="center";
 ctx.fillText(label,0,-35);
 ctx.restore();
}

function draw(){
 ctx.clearRect(0,0,W,H);
 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,"#62c7f5");
 sky.addColorStop(.55,"#c5f0ff");
 sky.addColorStop(.56,"#378d42");
 sky.addColorStop(1,"#174b2d");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

 polygon([[0,340],[100,240],[210,320],[350,220],
 [490,320],[640,235],[790,315],[900,250],[900,420],[0,420]],"#43874b");

 const horizon=175;
 polygon([[W/2-35,horizon],[W/2+35,horizon],[W+120,H],[-120,H]],"#343a42");

 for(let i=0;i<18;i++){
  let t=((i/18+roadOffset/900)%1);
  let y = horizon + t * t * (H - horizon);

// Wider road with stronger perspective
let half = 45 + t * 535;

// More noticeable bends
let center = W / 2 + Math.sin(roadOffset / 900 + t * 2) * 125;

// Larger roadside panels, especially near the viewer
let stripeH = 3 + t * 28;
  
  if(i%2===0){
  
   // Improved red-and-white roadside barriers
   const barrierW = 13 + t * 9;
   const leftBarrierX = center - half - barrierW;
   const rightBarrierX = center + half;
   
   // White barrier base
   ctx.fillStyle = "#f4f4f4";
   ctx.fillRect(leftBarrierX, y, barrierW, stripeH);
   ctx.fillRect(rightBarrierX, y, barrierW, stripeH);

   // Red alternating panels
   if (i % 2 === 0) {
     ctx.fillStyle = "#d83232";
     ctx.fillRect(leftBarrierX, y, barrierW, stripeH * 0.65);
     ctx.fillRect(rightBarrierX, y, barrierW, stripeH * 0.65);
   }

   // Yellow dashed center line
   ctx.fillStyle = "#ffe36e";
   ctx.fillRect(center - (1.5 + t * 2), y, 3 + t * 4, stripeH * 0.8);

   ctx.fillStyle="#fff0b0";
   ctx.fillRect(center-3,y,6,stripeH);
  }

 }

 for(let i=0;i<20;i++){
  const t=((i/20+roadOffset/1400)%1);
  const y=horizon+t*t*(H-horizon);
  const center=W/2+Math.sin(roadOffset/900+t*2)*95;
  const half=35+t*485;
  const size=8+t*30;
  for(const side of [-1,1]){
   const x=center+side*(half+20+t*45);
   ctx.fillStyle="#70482c";
   ctx.fillRect(x-size*.12,y-size*.3,size*.24,size*.8);
   ctx.fillStyle=i%2?"#176b3a":"#258a48";
   ctx.beginPath();ctx.arc(x,y-size*.55,size*.45,0,Math.PI*2);ctx.fill();
  }
 }

 // Draw the other player according to the distance between the cars.
 if(remote){
  const delta=remote.distance-distance;
  const y=Math.max(205,Math.min(H-155,H-105-delta*1.5));
  const t=Math.sqrt(Math.max(0.01,(y-horizon)/(H-horizon)));
  const center=W/2+Math.sin(roadOffset/900+t*2)*95;
  const half=35+t*485;
  const x=center+remote.x*half*.65;
  drawCar(x,y,"#38a8ff","FRIEND");
 }

 drawCar(W/2+carX*300,H-105,"#f02d4f","YOU");
 ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(18,18,245,68);
 ctx.fillStyle="white";ctx.font="bold 23px Arial";
 ctx.fillText("SPEED "+Math.round(speed*5)+" km/h",30,47);
 ctx.font="17px Arial";ctx.fillText("DISTANCE "+Math.floor(distance)+" m",30,72);
}


function loop(now) {
  if (raceStartAt && Date.now() < raceStartAt) {
    speed = 0;
    updateRaceDisplay();
  } else {
    if (keys["arrowup"] || keys["w"]) speed += 0.12;
    else speed -= 0.035;

    if (keys["arrowdown"] || keys["s"]) speed -= 0.18;

    speed = Math.max(0, Math.min(35, speed));

    if (keys["arrowleft"] || keys["a"]) carX -= 0.018 * (0.5 + speed / 15);
    if (keys["arrowright"] || keys["d"]) carX += 0.018 * (0.5 + speed / 15);

    carX = Math.max(-1.25, Math.min(1.25, carX));
    if (Math.abs(carX) > 1.05) speed *= 0.97;

    distance += speed / 35 * 0.12;
    roadOffset += speed * 1.8;

    if (raceStartAt && Date.now() >= raceStartAt && !raceFinished) {
      raceStarted = true;
      raceProgress = distance;

      currentLap = Math.min(
        totalLaps,
        Math.floor(raceProgress / lapDistance) + 1
      );

      document.getElementById("lapInfo").textContent =
        "Lap: " + currentLap + " / " + totalLaps;

      if (raceProgress >= totalLaps * lapDistance) {
        raceFinished = true;
        speed = 0;
        document.getElementById("lapInfo").textContent =
          "Lap: " + totalLaps + " / " + totalLaps;
        updateRaceDisplay();
      }
    }
  }

  document.getElementById("info").textContent =
    "Speed: " + Math.round(speed * 5) +
    " km/h | Distance: " + Math.floor(distance) + " m";

  if (conn && conn.open && now - lastSend > 70) {
    lastSend = now;
    try {
      conn.send({
        type: "car",
        x: carX,
        distance: distance,
        speed: speed
      });
    } catch (e) {}
  }

  updateRaceDisplay();
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>
 
<audio id="backgroundMusic" loop preload="none">
  <source src="./racing-music.mp3.mp3" type="audio/mpeg">
</audio>

<button id="musicToggle" type="button"
  style="position:fixed;right:12px;bottom:12px;z-index:9999;
  padding:10px 14px;border-radius:10px;cursor:pointer;">
  🎵 Music: OFF
</button>

<script>
(function () {
  const music = document.getElementById("backgroundMusic");
  const button = document.getElementById("musicToggle");

  music.volume = 0.25;

  button.addEventListener("click", async function () {
    if (music.paused) {
      try {
        await music.play();
        button.textContent = "🎵 Music: ON";
      } catch (error) {
        button.textContent = "Tap to start music";
      }
    } else {
      music.pause();
      button.textContent = "🎵 Music: OFF";
    }
  });

  music.addEventListener("error", function () {
    button.textContent = "Music file unavailable";
  });
})();
</script>

<script>
(function () {
  let audioContext;
  let oscillator;
  let gain;
  let engineStarted = false;

  function startEngine() {
    if (engineStarted) {
      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
      return;
    }

    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) return;

    audioContext = new AudioContextClass();
    oscillator = audioContext.createOscillator();
    gain = audioContext.createGain();

    oscillator.type = "sawtooth";
    oscillator.frequency.value = 65;
    gain.gain.value = 0;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start();

    engineStarted = true;
  }

  function updateEngine() {
    if (engineStarted && audioContext.state === "running") {
      const speedElement = document.getElementById("info");
      const match = speedElement &&
        speedElement.textContent.match(/Speed:\s*(\d+)/);

      const speed = match ? Number(match[1]) : 0;

      oscillator.frequency.setTargetAtTime(
        55 + speed * 2.5,
        audioContext.currentTime,
        0.08
      );

      gain.gain.setTargetAtTime(
        Math.min(0.055, speed / 700),
        audioContext.currentTime,
        0.1
      );
    }

    requestAnimationFrame(updateEngine);
  }

  document.addEventListener("keydown", startEngine, { once: true });
  document.addEventListener("pointerdown", startEngine, { once: true });

  requestAnimationFrame(updateEngine);
})();
</script>

</body>
</html>
